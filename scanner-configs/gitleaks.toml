title = "cg26-enhanced-secrets"

[extend]
useDefault = true

# Конфигурационные Bearer-литералы не похожи на типичный API-ключ,
# поэтому стандартный набор Gitleaks их пропускает.
[[rules]]
id = "cg26-bearer-in-config"
description = "Bearer token literal in application configuration"
regex = '''(?i)(?:authorization|token)\s*[:=]\s*["']?Bearer\s+[A-Za-z0-9._\-]{8,}'''
keywords = ["bearer"]

# Fallback после getenv — секрет лежит в репозитории, даже если рядом есть переменная окружения.
[[rules]]
id = "cg26-env-fallback-secret"
description = "Hardcoded secret used when an environment variable is missing"
regex = '''getenv\([^)\n]{0,80}\)\s*\?:\s*["'][^"'\n]{8,}["']'''
keywords = ["getenv"]

# Явное присваивание пароля строковым литералом.
[[rules]]
id = "cg26-password-assignment"
description = "Password assigned from a string literal"
regex = '''(?i)\b[\w.]*(?:password|passwd)\w*\s*=\s*["'][^"'\n]{6,}["']'''
keywords = ["password", "passwd"]

[allowlist]
description = "Placeholders, environment references, and non-secret fallbacks"

[[allowlist.regexes]]
regex = '''\$\{[A-Za-z_][A-Za-z0-9_]*\}'''

[[allowlist.regexes]]
regex = '''YOUR_API_KEY'''

[[allowlist.regexes]]
regex = '''UUID\.randomUUID\(\)'''

[[allowlist.paths]]
regex = '''(^|/)README\.md$'''
